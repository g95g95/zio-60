<script>
(function () {
  'use strict';

  // Mezzanotte del 13 ottobre, ora italiana (ancora CEST, +02:00). ?demo=N anticipa lo zero a N secondi da ora.
  var demo = parseFloat(new URLSearchParams(location.search).get('demo'));
  var TARGET = isFinite(demo) ? Date.now() + demo * 1000 : Date.parse('2026-10-13T00:00:00+02:00');

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var KANA = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789Z:.=*+-<>¦';
  var NOISE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+=<>';
  function pick(s) { return s[Math.floor(Math.random() * s.length)]; }
  function byId(id) { return document.getElementById(id); }

  // Il testo passa per caratteri casuali e si "decifra" da sinistra a destra.
  function decrypt(node, text, ms, alphabet) {
    if (reduced) { node.textContent = text; return; }
    clearInterval(node._dec);
    var t0 = performance.now();
    node._dec = setInterval(function () {
      var p = Math.min((performance.now() - t0) / ms, 1), solved = Math.floor(p * text.length), out = '';
      for (var i = 0; i < text.length; i++) out += i < solved || text[i] === ' ' ? text[i] : pick(alphabet);
      node.textContent = out;
      if (p >= 1) clearInterval(node._dec);
    }, 40);
  }

  var cap = byId('caption');
  [].forEach.call(cap.childNodes, function (n) {
    var target = n.nodeType === 3 ? n : n.firstChild;
    var text = target.textContent;
    var span = document.createElement('span');
    target.parentNode.replaceChild(span, target);
    decrypt(span, text, 1400, NOISE);
  });

  var el = { d: byId('d'), h: byId('h'), m: byId('m'), s: byId('s') };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function set(node, txt) {
    if (node._val === txt) return;
    node._val = txt;
    decrypt(node, txt, 260, '0123456789');
  }

  var timer;
  function tick() {
    var diff = TARGET - Date.now();
    if (diff <= 0) {
      clearInterval(timer);
      document.body.classList.add('done');
      document.title = 'AUGURI ZIO! 60 anni';
      Rain.party();
      return;
    }
    var t = Math.floor(diff / 1000);
    set(el.d, pad(Math.floor(t / 86400)));
    set(el.h, pad(Math.floor(t % 86400 / 3600)));
    set(el.m, pad(Math.floor(t % 3600 / 60)));
    set(el.s, pad(t % 60));
  }

  var Rain = (function () {
    var canvas = byId('rain');
    var ctx = canvas.getContext('2d', { alpha: false });
    var WORDS = ['60', 'anni', 'ziOooOooOooooOooOooooO'];
    var PARTY = ['AUGURI', 'ZIO!', '60', 'anni'];
    var KANA_FONT = '"MS Gothic", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", ';
    var W, H, dpr, fs, kfs, laneW, rowH, mono, back = [], front = [];
    var partying = false, flash = 0, speed = reduced ? 0.35 : 1;

    function stream() {
      var src = partying ? PARTY : WORDS;
      if (Math.random() < 0.65) return { words: src.slice(), gold: partying && Math.random() < 0.6 };
      var n = 1 + Math.floor(Math.random() * 3), out = [];
      for (var i = 0; i < n; i++) out.push(pick(src));
      return { words: out, gold: partying && Math.random() < 0.6 };
    }
    function drop(row) {
      var s = stream();
      return { row: row, words: s.words, gold: s.gold, idx: 0, gap: 0, prev: null };
    }
    // Due gocce per corsia a velocità condivisa: la nuova parte sopra l'altra e non la raggiunge mai.
    function respawn(other) { return drop(Math.min(other.row, 0) - (4 + Math.floor(Math.random() * 14))); }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      mono = getComputedStyle(document.body).fontFamily;

      kfs = Math.max(11, Math.min(17, W / 95));
      back = [];
      for (var i = 0, n = Math.ceil(W / kfs); i < n; i++) {
        back.push({ row: -Math.floor(Math.random() * H / kfs), interval: 45 + Math.random() * 90, acc: 0, prev: null });
      }

      fs = Math.max(12, Math.min(20, W / 85));
      ctx.font = 'bold ' + fs + 'px ' + mono;
      laneW = PARTY.concat(WORDS).reduce(function (m, w) { return Math.max(m, ctx.measureText(w).width); }, 0) + fs;
      rowH = fs * 1.4;
      front = [];
      for (var j = 0, k = Math.max(1, Math.floor(W / laneW)); j < k; j++) {
        var first = drop(-Math.floor(Math.random() * H / rowH));
        front.push({ x: j * laneW + (W - k * laneW) / 2 + fs / 2, interval: 70 + Math.random() * 90, acc: 0, drops: [first, respawn(first)] });
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Strato di fondo: katakana come nel film. Tutto lo strato è disegnato specchiato, quindi anche i glifi.
    function stepBack(c, x) {
      var y = c.row * kfs;
      if (c.row >= 0) {
        if (c.prev) { ctx.fillStyle = partying && Math.random() < 0.15 ? '#a8862c' : '#0b7a2a'; ctx.fillText(c.prev.g, x, c.prev.y); }
        var g = pick(KANA);
        ctx.fillStyle = '#9dffb6';
        ctx.fillText(g, x, y);
        c.prev = { g: g, y: y };
      }
      c.row++;
      if (y > H && Math.random() < 0.03) { c.row = 0; c.prev = null; }
    }

    function stepFront(col) {
      for (var k = 0; k < 2; k++) {
        var d = col.drops[k];
        if (d.row < 0) { d.row++; continue; }
        var y = d.row * rowH + fs;
        if (y > H + rowH) { col.drops[k] = respawn(col.drops[1 - k]); continue; }
        if (d.gap > 0) {
          d.gap--;
        } else {
          if (d.prev) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = d.prev.gold ? '#e0b43a' : '#00ff41';
            ctx.fillText(d.prev.w, col.x, d.prev.y);
          }
          var w = d.words[d.idx++];
          ctx.shadowBlur = fs * 0.8;
          ctx.shadowColor = d.gold ? '#ffd75e' : '#00ff41';
          ctx.fillStyle = d.gold ? '#fff4c9' : '#e2ffe9';
          ctx.fillText(w, col.x, y);
          d.prev = { w: w, y: y, gold: d.gold };
          if (d.idx >= d.words.length) {
            var s = stream();
            d.words = s.words; d.gold = s.gold; d.idx = 0;
            d.gap = 1 + Math.floor(Math.random() * 4);
          }
        }
        d.row++;
      }
      ctx.shadowBlur = 0;
    }

    var last = 0, raf = 0;
    function frame(now) {
      var dt = Math.min(now - last, 100) * speed;
      last = now;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Dissolvenza legata al tempo reale (≈5% per frame a 60 fps): stessa scia a qualsiasi frame rate.
      ctx.fillStyle = 'rgba(0, 0, 0, ' + (1 - Math.pow(0.95, dt / 16.67)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      if (flash > 0) {
        ctx.fillStyle = 'rgba(255, 215, 94, ' + (flash * 0.35).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
        flash = Math.max(0, flash - dt / 900);
      }

      ctx.setTransform(-dpr, 0, 0, dpr, W * dpr, 0);
      ctx.font = kfs + 'px ' + KANA_FONT + mono;
      for (var i = 0; i < back.length; i++) {
        var c = back[i];
        c.acc += dt;
        while (c.acc >= c.interval) { c.acc -= c.interval; stepBack(c, i * kfs); }
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = 'bold ' + fs + 'px ' + mono;
      for (var j = 0; j < front.length; j++) {
        var col = front[j];
        col.acc += dt;
        while (col.acc >= col.interval) { col.acc -= col.interval; stepFront(col); }
      }
      raf = requestAnimationFrame(frame);
    }
    function start() { cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame); }

    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) cancelAnimationFrame(raf); else start();
    });
    resize();
    start();

    return {
      party: function () {
        if (partying) return;
        partying = true;
        flash = reduced ? 0 : 1;
        speed *= 1.8;
      }
    };
  })();

  tick();
  timer = setInterval(tick, 250);
})();
</script>
</body>
</html>
